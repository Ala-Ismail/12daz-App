[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "12daz-converter"
version = "0.1.2"
description = "Offline 12d archive to 2D DXF converter"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["ezdxf==1.3.5"]

[project.scripts]
12daz-converter = "az12_converter.cli:main"

[project.gui-scripts]
12daz-converter-gui = "az12_converter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
az12_converter = ["resources/*"]
