name: Publish release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build, verify and publish as a pre-release.'
        required: true
        default: 'v0.1.4'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  tag:
    name: Prepare requested version tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Create new annotated tag or verify existing tag
        id: tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.4' }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Invalid version tag');
            const repo = context.repo;
            let existing;
            try {
              existing = (await github.rest.git.getRef({...repo, ref: `tags/${tag}`})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              if (context.eventName === 'push') {
                let object = existing.object;
                while (object.type === 'tag') {
                  object = (await github.rest.git.getTag({...repo, tag_sha: object.sha})).data.object;
                }
                if (object.type !== 'commit' || object.sha !== context.sha) {
                  throw new Error('Existing tag points to another commit; tags are never moved');
                }
              }
            } else {
              if (context.eventName !== 'push') throw new Error('Manual publication requires an existing tag');
              const annotated = await github.rest.git.createTag({
                ...repo, tag, message: `12dAZ Converter ${tag}`,
                object: context.sha, type: 'commit'
              });
              await github.rest.git.createRef({...repo, ref: `refs/tags/${tag}`, sha: annotated.data.sha});
            }
            core.setOutput('release_tag', tag);

  publish:
    name: Build and publish requested version
    needs: tag
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: ./.github/workflows/test.yml
    with:
      release_tag: ${{ needs.tag.outputs.release_tag }}
      publish_release: true
