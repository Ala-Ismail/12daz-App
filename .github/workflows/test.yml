name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build and prepare as a draft release (e.g. v0.1.2). Leave blank for a build only.'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish the verified pre-release instead of leaving it as a draft.'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      publish_release:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Test, build and verify Windows package
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
      package_name: ${{ steps.package.outputs.package_name }}
      release_tag: ${{ steps.package.outputs.release_tag }}
      signpath_artifact_id: ${{ steps.signpath-input.outputs.artifact-id }}
      source_commit: ${{ steps.package.outputs.source_commit }}
      implementation: ${{ steps.package.outputs.implementation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Validate version and tag
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          foreach ($name in @('SIGNING_ENABLED', 'SIGNPATH_ENABLED')) {
            $value = [string][Environment]::GetEnvironmentVariable($name)
            if ($value -cnotin @('', 'false', 'true')) { throw "$name must be unset, false or true" }
          }
          if ($env:SIGNING_ENABLED -eq 'true' -and $env:SIGNPATH_ENABLED -eq 'true') {
            throw 'Select only one signing provider: Azure or SignPath'
          }
          @'
          import os, re, runpy, tomllib
          from pathlib import Path
          rust_manifest = Path('rust/Cargo.toml')
          implementation = 'rust' if rust_manifest.is_file() else 'python'
          if implementation == 'rust':
              version = tomllib.loads(rust_manifest.read_text(encoding='utf-8'))['package']['version']
          else:
              version = runpy.run_path('src/az12_converter/__init__.py')['__version__']
              project = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8-sig'))
              if project['project']['version'] != version:
                  raise SystemExit('pyproject.toml and application versions disagree')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Expected numeric major.minor.patch version')
          tag = os.environ.get('RELEASE_TAG', '')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must match application version v{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\npackage_name=12dAZ-Converter-{version}-Windows-x64\nrelease_tag={tag}\nimplementation={implementation}\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Version validation failed' }
          "source_commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Install pinned build dependencies
        if: steps.package.outputs.implementation == 'python'
        run: python -m pip install -r requirements-build.txt
      - name: Run historical Python tests
        if: steps.package.outputs.implementation == 'python'
        run: python scripts/test.py
      - name: Build historical Python package
        if: steps.package.outputs.implementation == 'python'
        run: python scripts/build.py
      - name: Install Rust and the Python audit reader
        if: steps.package.outputs.implementation == 'rust'
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.99.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.lock
      - name: Run Rust core and desktop tests
        if: steps.package.outputs.implementation == 'rust'
        run: cargo test --manifest-path rust/Cargo.toml --locked --features desktop
      - name: Build and test Rust portable package
        if: steps.package.outputs.implementation == 'rust'
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
        run: |
          $null = New-Item -ItemType Directory -Force -Path outputs
          ./scripts/build_rust_windows.ps1 -OutputDirectory dist
          $archive = "dist/$env:PACKAGE_NAME.zip"
          ./scripts/test_rust_windows_package.ps1 -Archive $archive -Evidence outputs/rust-package-smoke.json
          Expand-Archive -LiteralPath $archive -DestinationPath dist
          $env:RUST_MIGRATION_CLI = (Resolve-Path rust/target/x86_64-pc-windows-msvc/release/az12-converter.exe).Path
          python -m unittest discover -s tests -p test_rust_migration.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --manifest-path rust/Cargo.toml --locked --example dxf_probe -- outputs/rust-dxf-probe.dxf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/audit_rust_dxf_probe.py outputs/rust-dxf-probe.dxf
      - name: Verify packaged application
        if: steps.package.outputs.implementation == 'python'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path outputs -Force | Out-Null
          $executable = Join-Path $PWD "dist/12dAZ-Converter-$env:PACKAGE_VERSION/12dAZ-Converter.exe"
          $report = Join-Path $PWD 'outputs/packaged-smoke.json'
          $smoke = Start-Process -FilePath $executable -ArgumentList @('--smoke-test', "`"$report`"") -WindowStyle Hidden -PassThru
          $processHandle = $smoke.Handle
          if (-not $smoke.WaitForExit(60000)) { throw 'Packaged smoke test timed out' }
          if ($smoke.ExitCode -ne 0) { throw "Packaged smoke test failed with exit code $($smoke.ExitCode)" }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.passed -or $result.application_version -ne $env:PACKAGE_VERSION) {
            throw 'Packaged smoke result failed or reported the wrong version'
          }
      - name: Create package checksum
        if: steps.package.outputs.implementation == 'python'
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
        run: |
          $archive = Join-Path $PWD "dist/$env:PACKAGE_NAME.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), "$hash  $env:PACKAGE_NAME.zip`n", [Text.Encoding]::ASCII)
      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: |
            dist/${{ steps.package.outputs.package_name }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.run_id }}
          path: |
            outputs/packaged-smoke.json
            outputs/rust-package-smoke.json
            build/12daz-converter/warn-12daz-converter.txt
          if-no-files-found: ignore

      - name: Upload executable for SignPath provenance verification
        id: signpath-input
        if: vars.SIGNPATH_ENABLED == 'true' && steps.package.outputs.release_tag != '' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}-signpath-input
          path: dist/12dAZ-Converter-${{ steps.package.outputs.version }}/12dAZ-Converter.exe
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign verified Windows release
    needs: windows
    if: >-
      vars.SIGNING_ENABLED == 'true' && vars.SIGNPATH_ENABLED != 'true' &&
      needs.windows.outputs.release_tag != '' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Validate signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT_NAME: ${{ vars.SIGNING_ACCOUNT_NAME }}
          SIGNING_CERTIFICATE_PROFILE: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          $required = @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT_NAME', 'SIGNING_CERTIFICATE_PROFILE', 'SIGNING_PUBLISHER')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing signing variable: $name. See docs/code_signing.md."
            }
          }
          $endpoint = [Uri]$env:SIGNING_ENDPOINT
          if ($endpoint.Scheme -ne 'https' -or -not $endpoint.Host.EndsWith('.codesigning.azure.net')) {
            throw 'Use the HTTPS endpoint shown in your Azure Artifact Signing account.'
          }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.package_name }}
          path: package
      - name: Verify and extract unsigned package
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ needs.windows.outputs.package_name }}
        run: |
          $archive = Join-Path $PWD "package/$env:PACKAGE_NAME.zip"
          $expectedLine = Get-Content -LiteralPath 'package/SHA256SUMS.txt' -Raw
          $expectedHash = ($expectedLine.Trim() -split '\s+')[0]
          if ($expectedHash -notmatch '^[0-9a-fA-F]{64}$' -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Unsigned package checksum verification failed'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath unsigned
      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign application executable and timestamp
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\unsigned\12dAZ-Converter-${{ needs.windows.outputs.version }}\12dAZ-Converter.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Verify signed executable and create final package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.windows.outputs.version }}
          PACKAGE_NAME: ${{ needs.windows.outputs.package_name }}
          SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
        run: |
          $folder = Join-Path $PWD "unsigned/12dAZ-Converter-$env:PACKAGE_VERSION"
          $executable = Join-Path $folder '12dAZ-Converter.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $executable
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or -not $signature.TimeStamperCertificate) {
            throw 'A valid trusted Authenticode signature and timestamp are required'
          }
          $publisher = $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -cne $env:SIGNING_PUBLISHER) { throw 'Signing certificate publisher does not match SIGNING_PUBLISHER' }
          $report = Join-Path $PWD 'signed-smoke.json'
          $smoke = Start-Process -FilePath $executable -ArgumentList @('--smoke-test', "`"$report`"") -WindowStyle Hidden -PassThru
          $processHandle = $smoke.Handle
          if (-not $smoke.WaitForExit(60000)) { throw 'Signed application smoke test timed out' }
          if ($smoke.ExitCode -ne 0) { throw "Signed application smoke test failed: $($smoke.ExitCode)" }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.passed -or $result.application_version -ne $env:PACKAGE_VERSION) {
            throw 'Signed application smoke result failed or reported the wrong version'
          }
          $archive = Join-Path $PWD "package/$env:PACKAGE_NAME.zip"
          Compress-Archive -LiteralPath $folder -DestinationPath $archive -Force
          Expand-Archive -LiteralPath $archive -DestinationPath roundtrip
          $packagedExe = Join-Path $PWD "roundtrip/12dAZ-Converter-$env:PACKAGE_VERSION/12dAZ-Converter.exe"
          if ((Get-FileHash -LiteralPath $packagedExe -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash) {
            throw 'Final ZIP did not preserve the signed executable'
          }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'package/SHA256SUMS.txt'), "$hash  $env:PACKAGE_NAME.zip`n", [Text.Encoding]::ASCII)
          "Trusted signature verified for $publisher; signed executable smoke test and final ZIP verification passed." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload signed release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.windows.outputs.package_name }}-signed
          path: |
            package/${{ needs.windows.outputs.package_name }}.zip
            package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  signpath:
    name: Request SignPath approval and verify signed release
    needs: windows
    if: >-
      vars.SIGNPATH_ENABLED == 'true' && vars.SIGNING_ENABLED != 'true' &&
      needs.windows.outputs.release_tag != '' &&
      github.repository == 'Ala-Ismail/12daz-App' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release-signing
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Packaging tools follow the reviewed workflow revision; source was built at the selected tag.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate SignPath settings
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_PUBLISHER: ${{ vars.SIGNPATH_PUBLISHER }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ARTIFACT_ID: ${{ needs.windows.outputs.signpath_artifact_id }}
        run: |
          $required = @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG', 'SIGNPATH_PUBLISHER', 'SIGNPATH_API_TOKEN', 'SIGNPATH_ARTIFACT_ID')
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing SignPath setting: $name. See docs/signpath_setup.md."
            }
          }
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.package_name }}
          path: package
      - name: Verify original package checksum
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ needs.windows.outputs.package_name }}
        run: |
          $archive = Join-Path $PWD "package/$env:PACKAGE_NAME.zip"
          $expected = ((Get-Content -LiteralPath 'package/SHA256SUMS.txt' -Raw).Trim() -split '\s+')[0]
          if ($expected -notmatch '^[0-9a-fA-F]{64}$' -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Original package checksum verification failed'
          }
      - name: Submit request and wait for manual SignPath approval
        id: signpath-request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.windows.outputs.signpath_artifact_id }}
          github-token: ${{ github.token }}
          parameters: |
            version: ${{ toJSON(needs.windows.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-executable
      - name: Record signing request for the release reviewer
        if: always() && steps.signpath-request.outputs.signing-request-id != ''
        shell: pwsh
        env:
          REQUEST_ID: ${{ steps.signpath-request.outputs.signing-request-id }}
          REQUEST_URL: ${{ steps.signpath-request.outputs.signing-request-web-url }}
          SOURCE_COMMIT: ${{ needs.windows.outputs.source_commit }}
          RELEASE_TAG: ${{ needs.windows.outputs.release_tag }}
        run: |
          "SignPath request: $env:REQUEST_ID ($env:REQUEST_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:RELEASE_TAG at $env:SOURCE_COMMIT" >> $env:GITHUB_STEP_SUMMARY
      - name: Verify signature, smoke test and package approved executable
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.windows.outputs.version }}
          PACKAGE_NAME: ${{ needs.windows.outputs.package_name }}
          SIGNPATH_PUBLISHER: ${{ vars.SIGNPATH_PUBLISHER }}
        run: |
          ./scripts/package_signpath_release.ps1 `
            -OriginalArchive "package/$env:PACKAGE_NAME.zip" `
            -SignedExecutable 'signed-executable/12dAZ-Converter.exe' `
            -Version $env:PACKAGE_VERSION `
            -ExpectedPublisher $env:SIGNPATH_PUBLISHER `
            -OutputDirectory 'signed-package'
      - name: Upload approved signed release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.windows.outputs.package_name }}-signed
          path: |
            signed-package/${{ needs.windows.outputs.package_name }}.zip
            signed-package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Prepare draft pre-release
    needs: [windows, sign, signpath]
    if: >-
      always() && !cancelled() && needs.windows.result == 'success' &&
      needs.windows.outputs.release_tag != '' && github.event_name != 'pull_request' &&
      ((vars.SIGNING_ENABLED == 'true' && vars.SIGNPATH_ENABLED != 'true' && needs.sign.result == 'success' && needs.signpath.result == 'skipped') ||
       (vars.SIGNPATH_ENABLED == 'true' && vars.SIGNING_ENABLED != 'true' && needs.signpath.result == 'success' && needs.sign.result == 'skipped') ||
       (vars.SIGNING_ENABLED != 'true' && vars.SIGNPATH_ENABLED != 'true' && needs.sign.result == 'skipped' && needs.signpath.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ format('{0}{1}', needs.windows.outputs.package_name, (needs.sign.result == 'success' || needs.signpath.result == 'success') && '-signed' || '') }}
          path: package
      - name: Verify download checksum
        working-directory: package
        run: sha256sum --check SHA256SUMS.txt
      - name: Create or refresh draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.windows.outputs.release_tag }}
          PACKAGE_NAME: ${{ needs.windows.outputs.package_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release && 'true' || 'false' }}
          SIGNED_PACKAGE: ${{ (needs.sign.result == 'success' || needs.signpath.result == 'success') && 'true' || 'false' }}
          SIGNPATH_PACKAGE: ${{ needs.signpath.result == 'success' && 'true' || 'false' }}
          IMPLEMENTATION: ${{ needs.windows.outputs.implementation }}
        run: |
          set -euo pipefail
          asset="package/$PACKAGE_NAME.zip"
          sums="package/SHA256SUMS.txt"
          cat > release-notes.md <<'NOTES'
          Free, MIT-licensed Windows converter from 12daz / 12da to editable DXF 2018.

          Extract the complete Windows ZIP and run 12dAZ-Converter.exe. Python, AutoCAD and 12d Model are not required on the user's computer.

          - **Flatten 2D** exports supported plan geometry, including verified drainage pipe spans. **Keep Z** preserves known elevations and supports solved alignment grades and symmetric parabolic profiles.
          - **Assume linear grade on arcs** lets Keep Z sample circular strings with varying elevations to the selected plan tolerance. The conversion report records the grade assumption.
          - Dense previews prioritize bends, closed outlines and spatial coverage within the shared 30,000-point budget. The title row includes the open button and filename.

          This is a preview build. Unsupported objects, omitted metadata/labels and style substitutions are reported. Review conversion reports before using exported drawings.

          The package passed automated tests and the packaged application smoke test in GitHub Actions. SHA256SUMS.txt contains its checksum.

          [Code signing policy](https://github.com/Ala-Ismail/12daz-App/blob/main/docs/code_signing_policy.md).
          NOTES
          if [[ "$IMPLEMENTATION" == "rust" ]]; then
            echo '' >> release-notes.md
            echo 'The ZIP includes the standalone Rust desktop and az12-converter.exe CLI. Clean-machine verification is tracked separately.' >> release-notes.md
          else
            echo '' >> release-notes.md
            echo 'Keep the bundled _internal folder beside the executable.' >> release-notes.md
            echo 'Independent CAD and clean-machine qualification remain pending for this historical build.' >> release-notes.md
          fi
          if [[ "$SIGNED_PACKAGE" == "true" ]]; then
            echo '' >> release-notes.md
            echo 'The application executable has a verified, timestamped publisher signature. New releases can still receive Microsoft Defender SmartScreen reputation warnings.' >> release-notes.md
            if [[ "$SIGNPATH_PACKAGE" == "true" ]]; then
              echo 'Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).' >> release-notes.md
            fi
          else
            echo '' >> release-notes.md
            echo 'This build is unsigned. Windows may show an unknown-publisher or Microsoft Defender SmartScreen warning.' >> release-notes.md
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt 2> release-error.txt; then
            if [[ "$(cat release-state.txt)" != "true" ]]; then
              echo "::notice::This release is already published; its assets were left unchanged. The new build is available as an Actions artifact."
              echo "Existing published release preserved. Download the verified build from this run's artifacts." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$asset" "$sums" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "$asset" "$sums" --verify-tag --draft --prerelease --title "12dAZ Converter $RELEASE_TAG" --notes-file release-notes.md
          fi
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
            echo "Pre-release published for $RELEASE_TAG with the verified Windows ZIP and checksum attached." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Draft pre-release prepared for $RELEASE_TAG. Review it under the repository's Releases page, then publish when ready." >> "$GITHUB_STEP_SUMMARY"
          fi
