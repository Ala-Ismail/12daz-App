name: Test and package
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/test.py
      - run: python scripts/build.py
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path outputs -Force | Out-Null
          $smoke = Start-Process -FilePath "$PWD/dist/12dAZ-Converter-0.1.2/12dAZ-Converter.exe" -ArgumentList @('--smoke-test', "$PWD/outputs/packaged-smoke.json") -WindowStyle Hidden -PassThru
          if (-not $smoke.WaitForExit(60000)) { throw 'Packaged smoke test timed out' }
          if ($smoke.ExitCode -ne 0) { throw 'Packaged smoke test failed' }
          if (-not (Get-Content outputs/packaged-smoke.json -Raw | ConvertFrom-Json).passed) { throw 'Smoke result did not pass' }
      - uses: actions/upload-artifact@v4
        with:
          name: 12dAZ-Converter-Windows-x64
          path: dist/12dAZ-Converter-0.1.2-Windows-x64.zip
